<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="35%" stop-color="#0a1022" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0c1e38" />
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- AWS Accent Gradient -->
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- High-Tech Coordinate Grid -->
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="14" />
  <rect width="1200" height="340" fill="url(#techGrid)" rx="14" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="70" r="130" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1080" cy="270" r="150" fill="#ff9900" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="170" r="200" fill="#3b82f6" opacity="0.06" filter="url(#glow)" />

  <!-- Outer Tech Border -->
  <rect x="1" y="1" width="1198" height="338" rx="13" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Geometric Circuit Accents -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.25" fill="none">
    <path d="M 40 170 L 160 170 L 200 130 L 320 130" />
    <path d="M 1160 170 L 1040 170 L 1000 210 L 880 210" />
    <circle cx="160" cy="170" r="3" fill="#38bdf8" />
    <circle cx="200" cy="130" r="3" fill="#38bdf8" />
    <circle cx="1040" cy="170" r="3" fill="#ff9900" stroke="#ff9900" />
    <circle cx="1000" cy="210" r="3" fill="#ff9900" stroke="#ff9900" />
  </g>

  <!-- Top Credential Pill Badge -->
  <g transform="translate(600, 48)">
    <rect x="-225" y="-16" width="450" height="32" rx="16" fill="#0f172a" stroke="#ff9900" stroke-width="1.2" filter="url(#badgeGlow)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffb84d" text-anchor="middle" letter-spacing="1.5">
      AWS CERTIFIED SOLUTIONS ARCHITECT • ASSOCIATE
    </text>
  </g>

  <!-- Primary Name Title -->
  <text x="600" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="3" filter="url(#badgeGlow)">
    RAHUL PATIL
  </text>

  <!-- Professional Subtitle -->
  <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="2">
    DEVOPS ENGINEER ASSOCIATE  •  SOLUTIONS ARCHITECT
  </text>

  <!-- Elegant Tech Divider Line -->
  <g transform="translate(600, 206)">
    <line x1="-160" y1="0" x2="160" y2="0" stroke="url(#nameGrad)" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#38bdf8"/>
  </g>

  <!-- Mission Statement / Sub-tagline -->
  <text x="600" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Designing Resilient AWS Architectures  •  Automating CI/CD Pipelines  •  Infrastructure as Code
  </text>

  <!-- Bottom Core Capability Pills -->
  <g transform="translate(600, 288)">
    <!-- Pill 1: Cloud Architecture -->
    <rect x="-300" y="-13" width="138" height="26" rx="13" fill="#1e293b" stroke="#ff9900" stroke-width="1" stroke-opacity="0.7"/>
    <text x="-231" y="4.5" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">☁️ AWS Cloud</text>

    <!-- Pill 2: DevOps & IaC -->
    <rect x="-144" y="-13" width="138" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7"/>
    <text x="-75" y="4.5" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⚙️ CI/CD &amp; IaC</text>

    <!-- Pill 3: Linux Systems -->
    <rect x="12" y="-13" width="138" height="26" rx="13" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.7"/>
    <text x="81" y="4.5" font-family="sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">🐧 Linux Admin</text>

    <!-- Pill 4: DevSecOps -->
    <rect x="168" y="-13" width="138" height="26" rx="13" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.7"/>
    <text x="237" y="4.5" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">🛡️ DevSecOps</text>
  </g>
</svg>