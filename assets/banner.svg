<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="180" r="220" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Tech Circuit Nodes / Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M 50 180 L 200 180 L 250 130 L 400 130" />
    <path d="M 1150 180 L 1000 180 L 950 230 L 800 230" />
    <path d="M 300 40 L 300 90 L 340 110" />
    <path d="M 900 320 L 900 270 L 860 250" />
  </g>
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="200" cy="180" r="4" />
    <circle cx="250" cy="130" r="4" />
    <circle cx="1000" cy="180" r="4" />
    <circle cx="950" cy="230" r="4" />
  </g>

  <!-- Top Accent Pill Badge: AWS Certified Solutions Architect - Associate -->
  <g transform="translate(600, 52)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#0f172a" stroke="#ff9900" stroke-width="1.5" filter="url(#subtle-glow)"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffb84d" text-anchor="middle" letter-spacing="1.5">
      ☁️ AWS CERTIFIED SOLUTIONS ARCHITECT – ASSOCIATE
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#subtle-glow)">
    RAHUL PATIL
  </text>

  <!-- Role Subtitle -->
  <text x="600" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    DEVOPS ENGINEER ASSOCIATE  •  SOLUTIONS ARCHITECT
  </text>

  <!-- Decorative Divider Line -->
  <line x1="420" y1="225" x2="780" y2="225" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Sub-Tagline -->
  <text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Designing Resilient Architectures  •  Automating CI/CD Pipelines  •  Securing Cloud Systems
  </text>

  <!-- Bottom Pill Badges -->
  <g transform="translate(600, 305)">
    <!-- Badge 1: AWS Solutions -->
    <rect x="-312.5" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="-232.5" y="4" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">☁️ AWS Solutions</text>

    <!-- Badge 2: DevOps & CI/CD -->
    <rect x="-137.5" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="-62.5" y="4" font-family="sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">⚙️ DevOps &amp; CI/CD</text>

    <!-- Badge 3: Linux Systems -->
    <rect x="27.5" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="97.5" y="4" font-family="sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">🐧 Linux Systems</text>

    <!-- Badge 4: DevSecOps -->
    <rect x="182.5" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="247.5" y="4" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🛡️ DevSecOps</text>
  </g>
</svg>